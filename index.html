<style>
:root{--dark:#3b2216;--cream:#fbf1e1;--accent:#f08a45;--ink:#2a160c;--line:#c9a98e;--soft:#ecd9c3;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--dark)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 18%,#5e3a22 0,var(--dark) 66%);color:var(--cream);font-family:"Varela Round","Heebo",Arial,sans-serif}
h1,.badge,.name,.price,.num,.btn,.phone{font-family:"Suez One","Varela Round",Arial,sans-serif;font-weight:400}
.one{width:100%;max-width:1000px;padding:clamp(10px,2.4svh,28px) 18px;display:grid;gap:clamp(10px,2.2svh,28px);justify-items:center;text-align:center}
.logo{width:clamp(84px,19svh,210px);height:auto;aspect-ratio:1;border-radius:50%;display:block;margin:0 auto clamp(6px,1.6svh,16px);box-shadow:0 0 0 4px var(--accent),0 0 0 5px var(--dark)}
h1{margin:0;font-size:clamp(28px,5.4svh,54px);line-height:1.1}
.sub{margin:4px 0 0;font-size:clamp(15px,2.5svh,22px);color:var(--soft)}
.badge{display:inline-block;margin-top:clamp(8px,1.6svh,16px);background:var(--accent);color:var(--ink);font-size:clamp(16px,2.6svh,23px);line-height:1.3;padding:4px 20px;border-radius:999px}
.panel{width:100%;max-width:460px;display:grid;gap:clamp(10px,2svh,18px)}
.menu{list-style:none;margin:0;padding:clamp(4px,1svh,10px) 20px;background:var(--cream);color:var(--dark);border-radius:22px}
.menu li{display:flex;align-items:baseline;gap:8px;font-size:clamp(16px,2.7svh,21px);padding:clamp(5px,1.2svh,10px) 0}
.dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.price{font-size:clamp(17px,2.9svh,23px);white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;list-style:none;margin:0;padding:0}
.steps li{font-size:clamp(13px,2.1svh,16px);line-height:1.3;color:var(--soft)}
.num{display:grid;place-items:center;width:clamp(24px,3.6svh,32px);height:clamp(24px,3.6svh,32px);margin:0 auto 4px;border-radius:50%;background:var(--accent);color:var(--ink);font-size:clamp(14px,2.2svh,18px)}
.cta{display:grid;gap:6px;justify-items:center}
.btn{display:inline-block;background:var(--accent);color:var(--ink);font-size:clamp(18px,2.9svh,22px);text-decoration:none;padding:clamp(9px,1.8svh,14px) 34px;border-radius:999px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,.phone:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.phone{color:var(--cream);font-size:clamp(17px,2.8svh,24px);text-decoration:none;direction:ltr}
html{background:#f6ecd6}
body{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .32 0 0 0 0 .2 0 0 0 .09 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),radial-gradient(ellipse at 50% 30%,#fdf8ec 0,#f6ecd6 62%,#e9d9b6 100%);color:var(--dark)}

.logo{box-shadow:0 0 0 4px var(--accent),0 6px 18px rgba(90,60,20,.3)}
.menu{background:#fffaf0;border:2px solid #c8a24d;border-radius:12px;box-shadow:inset 0 0 0 4px #fffaf0,inset 0 0 0 5.5px #c8a24d,0 8px 20px rgba(90,60,20,.18)}
.steps{border-top:1px solid #d8bf86;padding-top:clamp(8px,1.6svh,14px)}
.steps li{color:#5c3d2b}
.btn{box-shadow:0 5px 0 rgba(90,60,20,.3)}
.phone{color:var(--dark)}
.name{text-align:start}
.logo{width:clamp(56px,11.5svh,170px);margin-bottom:clamp(4px,1svh,12px)}
.one{gap:clamp(8px,1.4svh,20px);padding-block:clamp(8px,1.6svh,22px)}
.panel{gap:clamp(8px,1.4svh,14px)}
h1{font-size:clamp(26px,4.8svh,50px)}
.menu li{padding:clamp(3px,.6svh,8px) 0}
.badge{margin-top:clamp(6px,1.2svh,12px)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.gallery figure{margin:0;position:relative;height:clamp(48px,9.2svh,120px);border-radius:12px;overflow:hidden;border:2px solid #c8a24d;box-shadow:0 4px 12px rgba(90,60,20,.2)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery figcaption{position:absolute;inset:auto 0 0 0;padding:14px 4px 4px;background:linear-gradient(transparent,rgba(42,22,12,.8));color:#fff8e8;font-family:"Suez One","Varela Round",Arial,sans-serif;font-size:clamp(12px,1.9svh,15px);line-height:1.1;text-align:center}
.menu li{align-items:center}
.menu li.total{border-top:1px solid #d8bf86;margin-top:2px}
.total .name,.total .price{font-size:clamp(18px,3svh,23px)}
.qty{display:inline-flex;align-items:center;gap:2px;flex:none}
.qty button{width:clamp(30px,4.4svh,38px);height:clamp(30px,4.4svh,38px);border-radius:50%;border:1.5px solid #c8a24d;background:#fffaf0;color:var(--dark);font-family:"Suez One","Varela Round",Arial,sans-serif;font-size:22px;line-height:1;padding:0;cursor:pointer;display:grid;place-items:center}
.qty button.p{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.qty button:active{transform:scale(.93)}
.qty button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.q{min-width:1.7em;text-align:center;font-family:"Suez One","Varela Round",Arial,sans-serif;font-size:clamp(17px,2.8svh,21px)}
li.on .q{color:#b8501a}
.note2{margin:0;font-size:clamp(13px,2.1svh,16px);color:#5c3d2b;border-top:1px solid #d8bf86;padding-top:clamp(6px,1.2svh,12px)}
.qty button:disabled{opacity:.35;cursor:not-allowed}
.btn[aria-disabled="true"]{opacity:.5;box-shadow:none;cursor:not-allowed;filter:grayscale(.25)}
.menu li.foc{flex-wrap:wrap}
.tops{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 0 2px;font-size:clamp(12px,1.9svh,15px);color:#5c3d2b}
.chip{font-family:"Varela Round",Arial,sans-serif;font-size:inherit;color:var(--dark);background:#fffaf0;border:1.5px solid #c8a24d;border-radius:999px;padding:1px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gallery figure{height:clamp(40px,7.4svh,110px)}
.logo{width:clamp(48px,9.8svh,150px)}
h1{font-size:clamp(24px,4.2svh,46px)}
.menu li{padding:clamp(2px,.45svh,6px) 0}
.menu li{font-size:clamp(15px,min(2.7svh,4.8vw),21px)}
.menu li .price,.total .price{font-size:clamp(16px,min(2.9svh,5.1vw),23px)}
.total .name{font-size:clamp(17px,min(3svh,5.2vw),23px)}
.q{font-size:clamp(16px,min(2.8svh,4.8vw),21px)}
.qty button{width:clamp(28px,min(4.4svh,8.4vw),38px);height:clamp(28px,min(4.4svh,8.4vw),38px)}
.gallery figure{height:clamp(40px,min(7.4svh,17vw),110px)}
.logo{width:clamp(48px,min(9.8svh,26vw),150px)}
h1{font-size:clamp(24px,min(4.2svh,9vw),46px)}
.badge{font-size:clamp(15px,min(2.5svh,5vw),23px)}
.sub{font-size:clamp(14px,min(2.4svh,4.4vw),22px)}
.note2{font-size:clamp(12px,min(2svh,3.6vw),16px)}
.btn{font-size:clamp(17px,min(2.8svh,5.4vw),22px)}
.hint{font-size:clamp(12px,min(2svh,3.6vw),15px);color:#5c3d2b;text-align:center;line-height:1.3}
.btn{padding:clamp(6px,1.2svh,12px) 30px}
.gallery figure{height:clamp(36px,min(6.4svh,15vw),100px)}
.one{gap:clamp(6px,1.1svh,16px);padding-block:clamp(6px,1.2svh,18px)}
.panel{gap:clamp(6px,1.1svh,12px)}
.badge{margin-top:clamp(4px,.9svh,10px)}
.tops{gap:5px}
.chip{padding:1px 9px}
.tops>span{display:none}
.tops{justify-content:center}
.nm{display:block;width:100%;max-width:340px}
.nm input{width:100%;box-sizing:border-box;height:clamp(32px,4.8svh,42px);font:inherit;font-size:16px;color:var(--dark);background:#fffaf0;border:1.5px solid #c8a24d;border-radius:12px;padding:0 14px;text-align:center}
.nm input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.nm input.bad{border-color:#b3261e;background:#fff1ef}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hp{position:absolute;top:0;right:0;width:1px;height:1px;opacity:0;pointer-events:none}
@media (max-height:600px){.gallery{display:none}}
.units{flex-basis:100%;display:grid;gap:4px;max-height:66px;overflow-y:auto;scrollbar-width:thin;padding:0 0 2px}
.unit{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:5px;font-size:clamp(12px,1.9svh,15px);color:#5c3d2b}
.compact .gallery{display:none}
.units{scrollbar-width:none}
.units::-webkit-scrollbar{display:none}
.unit{gap:4px;font-size:clamp(11px,min(1.9svh,3.4vw),14px)}
.unit .chip{padding:1px 7px}
</style>

    rows.forEach(function(r,i){
      var isFoc=(r===focRow), q=isFoc?units.length:qty[i], p=Number(r.getAttribute('data-price')), nm=r.getAttribute('data-name');
      r.querySelector('.q').textContent=q; r.classList.toggle('on',q>0);
      r.querySelector('.p').disabled=closed || (isFoc ? units.length>=20 : (qty[i]>=20 || (remaining!==null && loaves>=remaining)));
      if(q<=0){ return; }
      total+=q*p;
      if(isFoc){
        groupUnits().forEach(function(g){ lines.push(g.n+' × '+nm+' ('+(g.sel[0]===NONE?NONE:'עם '+g.sel.join(', '))+') – '+(g.n*p)+' ש״ח'); });
        items.push({name:nm,qty:q,units:units.map(function(s){ return s.slice(); }),toppings:canon(units.reduce(function(a,s){ return a.concat(s); },[]))});
      } else { lines.push(q+' × '+nm+' – '+(q*p)+' ש״ח'); items.push({name:nm,qty:q}); }
    });
    drawUnits();
    cart={items:items,lines:lines,total:total};
    totalEl.textContent=total+' ש״ח';
    badgeEl.textContent = closed ? 'המלאי אזל' : (remaining!==null && remaining<=6) ? (remaining===1 ? 'נותר לחם אחד' : 'נותרו '+remaining+' לחמים') : 'המלאי מוגבל';
    if(closed){ btn.href='#'; btn.setAttribute('aria-disabled','true'); btn.textContent='המלאי אזל'; }
    else if(total>0){ buildHref(); btn.removeAttribute('aria-disabled'); btn.textContent='שלח הזמנה'; }
    else { btn.href='#'; btn.setAttribute('aria-disabled','true'); btn.textContent='בחרו לחם להזמנה'; }
    fit();
  }
  rows.forEach(function(r,i){
    r.querySelector('.p').addEventListener('click',function(){
      if(r===focRow){ if(units.length<20){ units.push([NONE]); render(); } }
      else if(qty[i]<20 && (remaining===null || loavesInCart()<remaining)){ qty[i]++; render(); }
    });
    r.querySelector('.m').addEventListener('click',function(){
      if(r===focRow){ if(units.length>0){ units.pop(); render(); } }
      else if(qty[i]>0){ qty[i]--; render(); }
    });
  });
  nameEl.addEventListener('input',function(){ nameEl.classList.remove('bad'); nameEl.removeAttribute('aria-invalid'); buildHref(); });
  btn.addEventListener('click',function(e){
    if(btn.getAttribute('aria-disabled')==='true'){ e.preventDefault(); return; }
    var nm=nameEl.value.trim();
    if(!nm){
      e.preventDefault();
      nameEl.classList.add('bad'); nameEl.setAttribute('aria-invalid','true');
      nameEl.placeholder='נא לכתוב שם להזמנה'; nameEl.focus();
      return;
    }
    var code=makeCode(); lastCode=code;
    buildHref(code);
    if(ORDERS_URL){
      try{
        fetch(ORDERS_URL,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},
          body:JSON.stringify({v:3,name:nm,code:code,items:cart.items,hp:hpEl.value})}).catch(function(){});
      }catch(err){}
    }
  });
  window.__stock=function(d){ if(d && typeof d.remaining==='number'){ remaining=d.remaining; render(); } };
  function loadStock(){
    if(!ORDERS_URL || document.hidden){ return; }
    var s=document.createElement('script');
    s.src=ORDERS_URL+'?cb=__stock&ex='+encodeURIComponent(lastCode)+'&t='+Date.now();
    s.async=true;
    s.onload=s.onerror=function(){ if(s.parentNode){ s.parentNode.removeChild(s); } };
    document.head.appendChild(s);
  }
  window.addEventListener('resize',fit);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden){ loadStock(); } });
  setInterval(loadStock,60000);
  render(); loadStock();
})();
</script>
</body>
</html>
